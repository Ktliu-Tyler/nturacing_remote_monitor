<!DOCTYPE html>
<html>
<head>
    <title>CSV Control Example</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .control-panel {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
        }
        .btn-primary {
            background: #007bff;
            color: white;
        }
        .btn-success {
            background: #28a745;
            color: white;
        }
        .btn-warning {
            background: #ffc107;
            color: black;
        }
        .btn-danger {
            background: #dc3545;
            color: white;
        }
        #fileList {
            max-height: 400px;
            overflow-y: auto;
            background: white;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 10px;
        }
        .file-item {
            padding: 10px;
            margin: 5px 0;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .file-item:hover {
            background: #e9ecef;
        }
        .file-item.selected {
            background: #007bff;
            color: white;
        }
        #status {
            padding: 10px;
            margin-top: 10px;
            border-radius: 4px;
            font-weight: bold;
        }
        .status-realtime { background: #d4edda; color: #155724; }
        .status-csv { background: #fff3cd; color: #856404; }
        .status-error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <h1>🎮 CSV Replay Control Panel</h1>
    
    <div class="control-panel">
        <h2>Mode Control</h2>
        <button class="btn-primary" onclick="requestCSVList()">📁 Request CSV Files</button>
        <button class="btn-success" onclick="switchToRealtime()">🔴 Switch to Realtime</button>
        <button class="btn-warning" onclick="togglePause()">⏯️ Pause/Resume</button>
        
        <div id="status" class="status-realtime">
            Mode: Realtime
        </div>
    </div>
    
    <div class="control-panel">
        <h2>CSV Files</h2>
        <div id="fileList">
            <p>Click "Request CSV Files" to load file list...</p>
        </div>
    </div>

    <script>
        let selectedFile = null;
        let ws = null;

        // WebSocket连接
        function connectWebSocket() {
            ws = new WebSocket('ws://' + window.location.hostname + ':' + window.location.port + '/ws');
            
            ws.onopen = () => {
                console.log('WebSocket connected');
            };
            
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                handleServerMessage(data);
            };
            
            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
            };
            
            ws.onclose = () => {
                console.log('WebSocket closed, reconnecting...');
                setTimeout(connectWebSocket, 3000);
            };
        }

        function handleServerMessage(data) {
            if (data.type === 'csv_files') {
                displayCSVFiles(data.files);
            } else if (data.type === 'mode_changed') {
                updateStatus(`Mode: ${data.mode}${data.file ? ' - ' + data.file : ''}`, 
                           data.mode === 'realtime' ? 'realtime' : 'csv');
            } else if (data.type === 'csv_status') {
                updateStatus(data.message, 'csv');
            } else if (data.type === 'error') {
                updateStatus('Error: ' + data.message, 'error');
            }
        }

        async function requestCSVList() {
            try {
                const response = await fetch('/api/csv/request_list', {
                    method: 'POST'
                });
                const result = await response.json();
                if (result.error) {
                    updateStatus('Error: ' + result.error, 'error');
                } else {
                    updateStatus('Requesting CSV file list...', 'csv');
                }
            } catch (error) {
                updateStatus('Error: ' + error.message, 'error');
            }
        }

        function displayCSVFiles(files) {
            const fileList = document.getElementById('fileList');
            
            if (files.length === 0) {
                fileList.innerHTML = '<p>No CSV files found</p>';
                return;
            }
            
            fileList.innerHTML = files.map(file => `
                <div class="file-item" onclick="selectFile('${file.filename}')">
                    <strong>${file.filename}</strong><br>
                    Size: ${file.size_mb} MB | Modified: ${new Date(file.modified).toLocaleString()}
                </div>
            `).join('');
        }

        async function selectFile(filename) {
            selectedFile = filename;
            
            // 高亮选中的文件
            document.querySelectorAll('.file-item').forEach(item => {
                if (item.textContent.includes(filename)) {
                    item.classList.add('selected');
                } else {
                    item.classList.remove('selected');
                }
            });
            
            // 发送选择请求
            try {
                const response = await fetch('/api/csv/select', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ filename: filename })
                });
                const result = await response.json();
                if (result.error) {
                    updateStatus('Error: ' + result.error, 'error');
                } else {
                    updateStatus('Starting CSV replay: ' + filename, 'csv');
                }
            } catch (error) {
                updateStatus('Error: ' + error.message, 'error');
            }
        }

        async function switchToRealtime() {
            try {
                const response = await fetch('/api/csv/switch_realtime', {
                    method: 'POST'
                });
                const result = await response.json();
                if (result.error) {
                    updateStatus('Error: ' + result.error, 'error');
                } else {
                    updateStatus('Switching to realtime mode...', 'realtime');
                }
            } catch (error) {
                updateStatus('Error: ' + error.message, 'error');
            }
        }

        async function togglePause() {
            try {
                const response = await fetch('/api/csv/pause', {
                    method: 'POST'
                });
                const result = await response.json();
                if (result.error) {
                    updateStatus('Error: ' + result.error, 'error');
                }
            } catch (error) {
                updateStatus('Error: ' + error.message, 'error');
            }
        }

        function updateStatus(message, type) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = 'status-' + type;
        }

        // 初始化
        connectWebSocket();
    </script>
</body>
</html>
